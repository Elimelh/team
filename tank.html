<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
        }
        #gameContainer {
            position: relative;
            background: #111;
            border: 2px solid #444;
            box-shadow: 0 0 20px rgba(0,255,0,0.2);
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            font-size: 14px;
            text-shadow: 0 0 5px #0f0;
            z-index: 10;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 12px;
            text-align: center;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f00;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 0 10px #f00;
            display: none;
            z-index: 20;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border: 2px solid #f00;
            border-radius: 8px;
            text-align: center;
        }
        #restartBtn {
            margin-top: 15px;
            padding: 8px 20px;
            font-size: 16px;
            background: #f00;
            color: #fff;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
        }
        #restartBtn:hover {
            background: #ff4444;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div>❤️ 生命: <span id="lives">3</span></div>
            <div>🎯 击杀: <span id="kills">0</span></div>
        </div>
        <div id="controls">
            WASD/方向键: 移动 | 空格/回车: 射击 | R: 重新开始
        </div>
        <div id="gameOver">
            <div>游戏结束</div>
            <button id="restartBtn">重新开始</button>
        </div>
    </div>

    <script>
        // ============ 游戏配置 ============
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 600;
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        // ============ 游戏状态 ============
        let player = null;
        let enemies = [];
        let bullets = [];
        let enemyBullets = [];
        let obstacles = [];
        let particles = [];
        let score = 0;
        let lives = 3;
        let gameRunning = true;
        let lastTime = 0;
        let enemySpawnTimer = 0;
        const ENEMY_SPAWN_INTERVAL = 3000; // 每3秒生成一个敌人
        const MAX_ENEMIES = 8;

        // ============ 键盘状态 ============
        const keys = {};
        const KEY_UP = ['w', 'arrowup'];
        const KEY_DOWN = ['s', 'arrowdown'];
        const KEY_LEFT = ['a', 'arrowleft'];
        const KEY_RIGHT = ['d', 'arrowright'];
        const KEY_SHOOT = [' ', 'enter'];

        // ============ 障碍物（砖墙） ============
        function initObstacles() {
            obstacles = [];
            // 生成砖墙布局
            const patterns = [
                // 横条砖墙
                {x: 200, y: 200, w: 120, h: 40},
                {x: 480, y: 200, w: 120, h: 40},
                {x: 200, y: 400, w: 120, h: 40},
                {x: 480, y: 400, w: 120, h: 40},
                // 竖条砖墙
                {x: 300, y: 150, w: 40, h: 120},
                {x: 460, y: 150, w: 40, h: 120},
                {x: 300, y: 350, w: 40, h: 120},
                {x: 460, y: 350, w: 40, h: 120},
                // 中央砖墙
                {x: 350, y: 280, w: 100, h: 40},
            ];
            patterns.forEach(p => {
                obstacles.push({
                    x: p.x, y: p.y, w: p.w, h: p.h,
                    color: '#b5651d',
                    health: 2
                });
            });
        }

        // ============ 坦克类 ============
        class Tank {
            constructor(x, y, isPlayer) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = 40;
                this.speed = isPlayer ? 150 : 60; // 像素/秒
                this.direction = isPlayer ? 'up' : 'down';
                this.isPlayer = isPlayer;
                this.alive = true;
                this.shootCooldown = 0;
                this.shootInterval = isPlayer ? 300 : 1500; // 毫秒
                this.color = isPlayer ? '#00ff00' : '#ff4444';
                this.turretColor = isPlayer ? '#00cc00' : '#cc0000';
                this.moveTimer = 0;
                this.aiMoveInterval = 1000; // AI移动间隔
            }

            update(dt) {
                if (!this.alive) return;

                // 射击冷却
                if (this.shootCooldown > 0) {
                    this.shootCooldown -= dt * 1000;
                }

                if (this.isPlayer) {
                    this.handlePlayerInput(dt);
                } else {
                    this.handleAI(dt);
                }
            }

            handlePlayerInput(dt) {
                let dx = 0, dy = 0;
                if (keys['w'] || keys['arrowup']) { dy = -1; this.direction = 'up'; }
                if (keys['s'] || keys['arrowdown']) { dy = 1; this.direction = 'down'; }
                if (keys['a'] || keys['arrowleft']) { dx = -1; this.direction = 'left'; }
                if (keys['d'] || keys['arrowright']) { dx = 1; this.direction = 'right'; }

                if (dx !== 0 || dy !== 0) {
                    // 归一化方向
                    const len = Math.sqrt(dx*dx + dy*dy);
                    dx /= len;
                    dy /= len;
                    this.move(dx * this.speed * dt, dy * this.speed * dt);
                }

                // 射击
                if (keys[' '] || keys['enter']) {
                    this.shoot();
                }
            }

            handleAI(dt) {
                this.moveTimer -= dt * 1000;
                if (this.moveTimer <= 0) {
                    // 随机改变方向
                    const dirs = ['up', 'down', 'left', 'right'];
                    this.direction = dirs[Math.floor(Math.random() * 4)];
                    this.moveTimer = this.aiMoveInterval;
                }

                let dx = 0, dy = 0;
                switch(this.direction) {
                    case 'up': dy = -1; break;
                    case 'down': dy = 1; break;
                    case 'left': dx = -1; break;
                    case 'right': dx = 1; break;
                }
                this.move(dx * this.speed * dt, dy * this.speed * dt);

                // 随机射击
                if (Math.random() < 0.02) {
                    this.shoot();
                }
            }

            move(dx, dy) {
                const newX = this.x + dx;
                const newY = this.y + dy;

                // 边界检测
                if (newX < 0 || newX + this.width > GAME_WIDTH ||
                    newY < 0 || newY + this.height > GAME_HEIGHT) {
                    return;
                }

                // 障碍物碰撞
                for (const obs of obstacles) {
                    if (this.collidesWith(newX, newY, obs)) {
                        return;
                    }
                }

                // 与其他坦克碰撞
                const allTanks = [player, ...enemies].filter(t => t && t.alive && t !== this);
                for (const tank of allTanks) {
                    if (this.collidesWithTank(newX, newY, tank)) {
                        return;
                    }
                }

                this.x = newX;
                this.y = newY;
            }

            collidesWith(x, y, obs) {
                return x < obs.x + obs.w &&
                       x + this.width > obs.x &&
                       y < obs.y + obs.h &&
                       y + this.height > obs.y;
            }

            collidesWithTank(x, y, tank) {
                return x < tank.x + tank.width &&
                       x + this.width > tank.x &&
                       y < tank.y + tank.height &&
                       y + this.height > tank.y;
            }

            shoot() {
                if (this.shootCooldown > 0) return;
                this.shootCooldown = this.shootInterval;

                const bullet = {
                    x: this.x + this.width/2 - 3,
                    y: this.y + this.height/2 - 3,
                    width: 6,
                    height: 6,
                    speed: 300,
                    direction: this.direction,
                    isPlayer: this.isPlayer,
                    alive: true
                };

                if (this.isPlayer) {
                    bullets.push(bullet);
                } else {
                    enemyBullets.push(bullet);
                }
            }

            draw() {
                if (!this.alive) return;
                ctx.save();
                ctx.translate(this.x + this.width/2, this.y + this.height/2);
                ctx.rotate(this.getRotation());

                // 坦克主体
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);

                // 炮管
                ctx.fillStyle = this.turretColor;
                ctx.fillRect(-4, -this.height/2 - 6, 8, this.height/2 + 6);

                // 履带
                ctx.fillStyle = '#333';
                ctx.fillRect(-this.width/2, -this.height/2, 8, this.height);
                ctx.fillRect(this.width/2 - 8, -this.height/2, 8, this.height);

                ctx.restore();
            }

            getRotation() {
                switch(this.direction) {
                    case 'up': return 0;
                    case 'down': return Math.PI;
                    case 'left': return -Math.PI/2;
                    case 'right': return Math.PI/2;
                    default: return 0;
                }
            }
        }

        // ============ 子弹更新 ============
        function updateBullets(dt) {
            // 玩家子弹
            bullets = bullets.filter(b => b.alive);
            bullets.forEach(b => {
                switch(b.direction) {
                    case 'up': b.y -= b.speed * dt; break;
                    case 'down': b.y += b.speed * dt; break;
                    case 'left': b.x -= b.speed * dt; break;
                    case 'right': b.x += b.speed * dt; break;
                }

                // 边界
                if (b.x < 0 || b.x > GAME_WIDTH || b.y < 0 || b.y > GAME_HEIGHT) {
                    b.alive = false;
                    return;
                }

                // 障碍物碰撞
                for (const obs of obstacles) {
                    if (b.x < obs.x + obs.w &&
                        b.x + b.width > obs.x &&
                        b.y < obs.y + obs.h &&
                        b.y + b.height > obs.y) {
                        b.alive = false;
                        obs.health--;
                        createParticles(b.x, b.y, 5, '#ffaa00');
                        if (obs.health <= 0) {
                            obstacles = obstacles.filter(o => o !== obs);
                            createParticles(obs.x + obs.w/2, obs.y + obs.h/2, 15, '#b5651d');
                        }
                        return;
                    }
                }

                // 敌人碰撞
                for (const enemy of enemies) {
                    if (!enemy.alive) continue;
                    if (b.x < enemy.x + enemy.width &&
                        b.x + b.width > enemy.x &&
                        b.y < enemy.y + enemy.height &&
                        b.y + b.height > enemy.y) {
                        b.alive = false;
                        enemy.alive = false;
                        score++;
                        createParticles(enemy.x + enemy.width/2, enemy.y + enemy.height/2, 20, '#ff4444');
                        document.getElementById('kills').textContent = score;
                        return;
                    }
                }
            });

            // 敌人子弹
            enemyBullets = enemyBullets.filter(b => b.alive);
            enemyBullets.forEach(b => {
                switch(b.direction) {
                    case 'up': b.y -= b.speed * dt; break;
                    case 'down': b.y += b.speed * dt; break;
                    case 'left': b.x -= b.speed * dt; break;
                    case 'right': b.x += b.speed * dt; break;
                }

                // 边界
                if (b.x < 0 || b.x > GAME_WIDTH || b.y < 0 || b.y > GAME_HEIGHT) {
                    b.alive = false;
                    return;
                }

                // 障碍物碰撞
                for (const obs of obstacles) {
                    if (b.x < obs.x + obs.w &&
                        b.x + b.width > obs.x &&
                        b.y < obs.y + obs.h &&
                        b.y + b.height > obs.y) {
                        b.alive = false;
                        obs.health--;
                        createParticles(b.x, b.y, 5, '#ffaa00');
                        if (obs.health <= 0) {
                            obstacles = obstacles.filter(o => o !== obs);
                        }
                        return;
                    }
                }

                // 玩家碰撞
                if (player && player.alive) {
                    if (b.x < player.x + player.width &&
                        b.x + b.width > player.x &&
                        b.y < player.y + player.height &&
                        b.y + b.height > player.y) {
                        b.alive = false;
                        playerHit();
                        return;
                    }
                }
            });
        }

        // ============ 粒子效果 ============
        function createParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 200,
                    vy: (Math.random() - 0.5) * 200,
                    life: 0.5 + Math.random() * 0.5,
                    maxLife: 0.5 + Math.random() * 0.5,
                    color: color,
                    size: 2 + Math.random() * 3
                });
            }
        }

        function updateParticles(dt) {
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt;
            });
        }

        // ============ 玩家受伤 ============
        function playerHit() {
            if (!player.alive) return;
            lives--;
            document.getElementById('lives').textContent = lives;
            createParticles(player.x + player.width/2, player.y + player.height/2, 30, '#ff0000');

            if (lives <= 0) {
                player.alive = false;
                gameOver();
            } else {
                // 重生
                player.x = 380;
                player.y = 540;
                player.direction = 'up';
                player.shootCooldown = 1000;
            }
        }

        // ============ 游戏结束 ============
        function gameOver() {
            gameRunning = false;
            document.getElementById('gameOver').style.display = 'block';
        }

        // ============ 敌人生成 ============
        function spawnEnemy() {
            if (enemies.filter(e => e.alive).length >= MAX_ENEMIES) return;

            const positions = [
                {x: 0, y: 0},
                {x: GAME_WIDTH - 40, y: 0},
                {x: 0, y: 100},
                {x: GAME_WIDTH - 40, y: 100}
            ];

            // 随机选择一个位置
            const pos = positions[Math.floor(Math.random() * positions.length)];
            const enemy = new Tank(pos.x, pos.y, false);
            enemies.push(enemy);
        }

        // ============ 绘制 ============
        function draw() {
            // 清屏
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // 网格背景
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            for (let i = 0; i < GAME_WIDTH; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, GAME_HEIGHT);
                ctx.stroke();
            }
            for (let i = 0; i < GAME_HEIGHT; i += 40) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(GAME_WIDTH, i);
                ctx.stroke();
            }

            // 障碍物
            obstacles.forEach(obs => {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                // 砖块纹理
                ctx.strokeStyle = '#8B4513';
                ctx.lineWidth = 1;
                for (let bx = obs.x; bx < obs.x + obs.w; bx += 20) {
                    for (let by = obs.y; by < obs.y + obs.h; by += 20) {
                        ctx.strokeRect(bx, by, 20, 20);
                    }
                }
            });

            // 玩家
            if (player && player.alive) {
                player.draw();
            }

            // 敌人
            enemies.forEach(enemy => {
                if (enemy.alive) enemy.draw();
            });

            // 子弹
            bullets.forEach(b => {
                ctx.fillStyle = '#ffff00';
                ctx.shadowColor = '#ffff00';
                ctx.shadowBlur = 10;
                ctx.fillRect(b.x, b.y, b.width, b.height);
                ctx.shadowBlur = 0;
            });

            enemyBullets.forEach(b => {
                ctx.fillStyle = '#ff8800';
                ctx.shadowColor = '#ff8800';
                ctx.shadowBlur = 10;
                ctx.fillRect(b.x, b.y, b.width, b.height);
                ctx.shadowBlur = 0;
            });

            // 粒子
            particles.forEach(p => {
                const alpha = p.life / p.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            });
            ctx.globalAlpha = 1;
        }

        // ============ 游戏主循环 ============
        function gameLoop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
            lastTime = timestamp;

            if (gameRunning) {
                // 更新
                if (player) player.update(dt);
                enemies.forEach(e => e.update(dt));
                updateBullets(dt);
                updateParticles(dt);

                // 敌人生成
                enemySpawnTimer += dt * 1000;
                if (enemySpawnTimer >= ENEMY_SPAWN_INTERVAL) {
                    enemySpawnTimer = 0;
                    spawnEnemy();
                }

                // 清理死亡敌人
                enemies = enemies.filter(e => e.alive);
            }

            // 绘制
            draw();

            requestAnimationFrame(gameLoop);
        }

        // ============ 初始化 ============
        function init() {
            // 重置状态
            score = 0;
            lives = 3;
            gameRunning = true;
            bullets = [];
            enemyBullets = [];
            particles = [];
            enemies = [];
            enemySpawnTimer = 0;

            // 初始化障碍物
            initObstacles();

            // 创建玩家
            player = new Tank(380, 540, true);

            // 初始敌人
            for (let i = 0; i < 3; i++) {
                spawnEnemy();
            }

            // 更新 UI
            document.getElementById('lives').textContent = lives;
            document.getElementById('kills').textContent = score;
            document.getElementById('gameOver').style.display = 'none';
        }

        // ============ 事件监听 ============
        document.addEventListener('keydown', (e) => {
            e.preventDefault();
            keys[e.key.toLowerCase()] = true;

            // R 键重新开始
            if (e.key.toLowerCase() === 'r' && !gameRunning) {
                init();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // 重新开始按钮
        document.getElementById('restartBtn').addEventListener('click', () => {
            init();
        });

        // ============ 启动 ============
        init();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
